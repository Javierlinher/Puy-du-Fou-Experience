[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.12.0"
constraintlayout = "2.2.1"
# Versión del Navigation Component
# Se usa para gestionar la navegación entre fragments (NavController, nav_graph.xml)
navigation = "2.9.3"

# Versión de Room
# ORM oficial de Android para trabajar con SQLite
room = "2.7.0"

# Versión de KSP (Kotlin Symbol Processing)
# Necesaria para que Room genere código en compilación
# Debe ir alineada con la versión de Kotlin del proyecto
ksp = "2.0.21-1.0.28"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# Navigation Component (fragment)
# Permite usar NavHostFragment y navegar entre fragments
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }

# Navigation Component (ui)
# Integración de navegación con Toolbar y BottomNavigationView
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }

# Room runtime
# Núcleo de Room para acceder a la base de datos
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }

# Room KTX
# Añade soporte para coroutines (suspend, Flow)
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# Room compiler
# Genera el código de DAOs y Database usando KSP
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# KSP (Kotlin Symbol Processing)
# Necesario para que Room genere código automáticamente
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }


